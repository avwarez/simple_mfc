name: MSVC build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    # Last line of defence. Configure+build+test is a ~1 minute job; without
    # a cap, anything that blocks instead of failing (a Windows modal dialog
    # on a headless runner is the case this suite actually hit) holds the
    # runner until GitHub's own 6-hour limit. The test executables and
    # compare.cmake both have their own, tighter timeouts.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake auto-detects the Visual Studio generator on windows-latest)
        # SIMPLE_MFC_BUILD_GUI_CORE_TEST=ON also builds gui/core (message-map
        # dispatch + CWinThread/AfxBeginThread) and its runtime test, so the
        # threading/dispatch layer is validated on MSVC (the primary target),
        # including eMule's bare-name pointer-to-member map form.
        run: cmake -S . -B build -DSIMPLE_MFC_BUILD_GUI_CORE_TEST=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  conformance:
    # Runs the conformance suite: every simple_mfc method exercised with
    # the same input against the real Visual Studio MFC libraries, output
    # compared byte-for-byte. Requires the "MFC and ATL" VS component,
    # which is not guaranteed to be preinstalled on the runner image, so
    # it is installed explicitly below. Real MFC is statically linked
    # (CMAKE_MFC_FLAG), so no redistributable DLLs are needed.
    runs-on: windows-latest
    # Installing the ATL/MFC VS component dominates this job's runtime; the
    # cap is sized for that, not for the suite itself. Same rationale as the
    # build job above.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the MFC and ATL Visual Studio component
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vsPath = & "$installerDir\vswhere.exe" -latest -property installationPath
          Write-Host "Visual Studio install path: $vsPath"
          $proc = Start-Process -FilePath "$installerDir\vs_installer.exe" -ArgumentList @(
            'modify',
            '--installPath', "`"$vsPath`"",
            '--add', 'Microsoft.VisualStudio.Component.VC.ATLMFC',
            '--quiet', '--norestart'
          ) -Wait -PassThru
          if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
            throw "vs_installer.exe failed with exit code $($proc.ExitCode)"
          }

      - name: Configure (conformance tests enabled)
        run: cmake -S . -B build -DSIMPLE_MFC_BUILD_CONFORMANCE_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run conformance suite (simple_mfc vs. real MFC)
        env:
          # Several cases build a CTime from local components and read back
          # epoch seconds, so their value moves with the zone. Pinned here and
          # in golden.cmake alike, so the recording and every later replay of
          # it agree by construction rather than by the runner's default.
          TZ: UTC0
        run: ctest --test-dir build -C Release --output-on-failure

      # Real MFC exists only here. Record what it printed so builds on
      # platforms that have no MFC at all -- above all the POSIX build the Qt
      # frontend runs on -- can be compared against it. Commit the artifact to
      # tests/conformance/golden/real_mfc_win32.txt to arm that comparison;
      # once committed, the golden_recording_is_current test above re-derives
      # this on every run and fails if the file has drifted.
      - name: Record real MFC's output as the golden file
        shell: pwsh
        env:
          TZ: UTC0
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path build -Recurse -Filter real_mfc_probe.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "real_mfc_probe.exe not found under build/" }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          # -Encoding ascii would mangle the probe's UTF-8; the probe already
          # emits UTF-8 bytes explicitly (see Utf8() in cases.cpp), so write
          # them through unchanged and with LF endings, matching what the
          # POSIX side will read back.
          $out = & $exe.FullName
          [System.IO.File]::WriteAllText(
              "artifact/real_mfc_win32.txt",
              ($out -join "`n") + "`n",
              (New-Object System.Text.UTF8Encoding $false))
          Write-Host "recorded $($out.Count) cases"

      - name: Upload the golden recording
        uses: actions/upload-artifact@v4
        with:
          name: real-mfc-golden
          path: artifact/real_mfc_win32.txt
